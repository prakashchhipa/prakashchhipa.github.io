# Open-source releases shown on /repositories/. Add new repos here.

releases:
  - name: Möbius-MPD
    kind: Library · PyPI
    desc: Möbius perspective-distortion augmentation for PyTorch and Albumentations. Train perspective-robust models without camera parameters.
    cmd: pip install mobius-mpd
    links:
      - { label: PyPI, url: "https://pypi.org/project/mobius-mpd/" }
      - { label: GitHub, url: "https://github.com/prakashchhipa/mobius-mpd" }
  - name: AskAnythingInCharts
    kind: Model · Hugging Face
    desc: Qwen2.5-VL-7B fine-tuned with LoRA for chart question answering. ChartQA accuracy from 57.5% to 66.0%, with a live demo.
    links:
      - { label: Model, url: "https://huggingface.co/prakashchhipa/Qwen2.5-VL-7B-ChartQA-LoRA" }
      - { label: Demo, url: "https://huggingface.co/spaces/prakashchhipa/chart-qa-demo-qwen2.5" }
      - { label: Code, url: "https://github.com/prakashchhipa/AskAnythingInCharts-Qwen2.5-7B" }
  - name: ImageNet-PD
    kind: Dataset · Hugging Face
    desc: A perspectively distorted ImageNet benchmark that measures how vision models cope with real-world viewpoint change.
    links:
      - { label: Dataset, url: "https://huggingface.co/datasets/prakashchhipa/ImageNet-PD" }
  - name: MPD-SSL
    kind: Pretrained models · Hugging Face
    desc: Self-supervised checkpoints trained with Möbius-MPD (ECCV 2024), ready for robust downstream fine-tuning.
    links:
      - { label: Models, url: "https://huggingface.co/prakashchhipa/MPD_SSL" }

